name: Skill checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Deterministic regressions
        run: |
          python scripts/test_tools.py --report "$RUNNER_TEMP/base.json"
          python scripts/test_extended.py --report "$RUNNER_TEMP/extended.json"
      - name: Python syntax
        run: python -c 'import ast,pathlib; [ast.parse(p.read_text()) for p in pathlib.Path("scripts").glob("*.py")]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-python-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/base.json
            ${{ runner.temp }}/extended.json
          if-no-files-found: error
          retention-days: 30
